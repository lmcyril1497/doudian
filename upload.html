<div id="s">读取本地数据...</div>
<script>
var _user=localStorage.getItem('dou_user');var _admin=localStorage.getItem('dou_admin');
if(!_user||!_admin){document.getElementById('s').textContent='⚠️ 无权限，请先以管理员身份登录主页面';throw new Error('Unauthorized');}
var k='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0cXp1cXFxeXRkaWh4eWJoaGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE4NzAsImV4cCI6MjA5OTE2Nzg3MH0.EQUhNToGoQkdXLsKpHsw8gITaTVA0mtFhtN1MEbxzBc';
var d=JSON.parse(localStorage.getItem('doudian_clients')||'[]');
var s=document.getElementById('s');
s.textContent='上传中... 0/'+d.length;
var done=0;
function next(i){
  if(i>=d.length){s.textContent='完成！'+done+'/'+d.length+' 条已上传。关闭此页。';return;}
  d[i].user_id='18211383968';
  fetch('https://ytqzuqqqytdihxybhhcy.supabase.co/rest/v1/clients',{
    method:'POST',
    headers:{apikey:k,Authorization:'Bearer '+k,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},
    body:JSON.stringify(d[i])
  }).then(function(){done++;s.textContent='上传中... '+done+'/'+d.length;next(i+1);})
  .catch(function(){done++;next(i+1);});
}
next(0);
</script>
</body></html>

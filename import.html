<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>数据导入</title></head><body>
<div id="s">正在读取数据...</div>
<script>
var _user=localStorage.getItem('dou_user');var _admin=localStorage.getItem('dou_admin');
if(!_user||!_admin){document.getElementById('s').textContent='⚠️ 无权限，请先以管理员身份登录主页面';throw new Error('Unauthorized');}
var key='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0cXp1cXFxeXRkaWh4eWJoaGN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE4NzAsImV4cCI6MjA5OTE2Nzg3MH0.EQUhNToGoQkdXLsKpHsw8gITaTVA0mtFhtN1MEbxzBc';
var h={apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'};
fetch('1.txt').then(r=>r.text()).then(function(t){
  var list=JSON.parse(t.trim()); var done=0; var total=list.length;
  document.getElementById('s').textContent='导入中... 0/'+total;
  function next(i){
    if(i>=total){ document.getElementById('s').textContent='完成！'+done+'/'+total+' 条已恢复。关闭此页回抖店刷新。'; return; }
    var c=list[i]; c.user_id='18211383968';
    fetch('https://ytqzuqqqytdihxybhhcy.supabase.co/rest/v1/clients',{method:'POST',headers:h,body:JSON.stringify(c)})
    .then(function(r){ done++; document.getElementById('s').textContent='导入中... '+done+'/'+total+(r.ok?' OK':' FAIL'); next(i+1); })
    .catch(function(){ done++; next(i+1); });
  }
  next(0);
});
</script>
</body></html>
